      const [activeModalReq, setActiveModalReq] = useState(null);
      const [activeReceiptReq, setActiveReceiptReq] = useState(null);
      const [activeRevisionReq, setActiveRevisionReq] = useState(null);
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(null); // 'login' | 'register' | null
      const [adminNoteInput, setAdminNoteInput] = useState('');
      const [toastMsg, setToastMsg] = useState(null);

      useEffect(() => {
        localStorage.setItem('rik_personas', JSON.stringify(personas));
      }, [personas]);

      useEffect(() => {

      useEffect(() => {

      useEffect(() => {

      }, [reservations]);

      useEffect(() => {

      }, [equipment]);

      const isTUAdmin = currentUser.role === 'tu_admin';
      const facultyMeta = FACULTIES_DATA[currentUser.faculty] || FACULTIES_DATA.PUSAT_RIK;

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      const handleSwitchUser = (user) => {
        setCurrentUser(user);
        setShowPersonaMenu(false);
        setActiveTab(user.role === 'tu_admin' ? 'admin_dashboard' : 'faculty_dashboard');
        triggerToast(`Beralih akun: ${user.name} (${user.organization})`);
      };

      const resetDemoData = () => {
        localStorage.clear();
        setFacilities(SEED_FACILITIES);
        setReservations(SEED_RESERVATIONS);
        setEquipment(SEED_EQUIPMENT);
        setCurrentUser(SEED_PERSONAS[0]);
        setActiveTab('admin_dashboard');
        triggerToast('Semua data simulasi berhasil direset ke kondisi awal!');
      };

      const handleDecision = (reservationId, newStatus) => {
        const target = reservations.find((r) => r.id === reservationId);
        if (!target) return;

        // If approving, prevent overlapping room bookings and equipment overbooking
        if (newStatus === 'approved') {
          const start = new Date(target.startTime).getTime();
          const end = new Date(target.endTime).getTime();

          // 1. Room conflict check
          const roomConflict = reservations.find((r) =>
            r.id !== target.id &&
            r.facilityId === target.facilityId &&
            r.status === 'approved' &&
            start < new Date(r.endTime).getTime() &&
            end > new Date(r.startTime).getTime()
          );

          if (roomConflict) {
            alert(`⚠️ GAGAL MENYETUJUI (DOUBLE-BOOKING): Terdapat jadwal bentrok dengan acara "${roomConflict.title}" (${new Date(roomConflict.startTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} - ${new Date(roomConflict.endTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} WIB).`);
            return;
          }

          // 2. Equipment overbooking check
          if (target.equipment && target.equipment.length > 0) {
            const overlappingApproved = reservations.filter((r) =>
              r.id !== target.id &&
              r.status === 'approved' &&
              start < new Date(r.endTime).getTime() &&
              end > new Date(r.startTime).getTime()
            );

            for (const eqReq of target.equipment) {
              const eqItem = equipment.find((e) => e.id === eqReq.equipmentId);
              if (!eqItem) continue;

              let committed = 0;
              for (const res of overlappingApproved) {
                const match = res.equipment?.find((e) => e.equipmentId === eqReq.equipmentId);
                if (match) committed += (match.quantityApproved ?? match.quantityRequested);
              }

              const availableForWindow = Math.max(0, eqItem.totalQuantity - committed);
              const requested = eqReq.quantityApproved ?? eqReq.quantityRequested;

              if (requested > availableForWindow) {
                alert(`⚠️ GAGAL MENYETUJUI (OVERBOOKING SARPRAS): Kuota peralatan "${eqItem.name}" tidak mencukupi untuk rentang waktu ini. Tersedia: ${availableForWindow} unit, Diminta: ${requested} unit.`);
                return;
              }
            }
          }
        }

        const note = adminNoteInput.trim() || (
          newStatus === 'approved' ? 'Disetujui oleh TU Pusat RIK.' :
          newStatus === 'revision_requested' ? 'Perlu perbaikan berkas surat izin.' :
          'Ditolak: Dokumen perizinan belum memenuhi kriteria.'
        );

        const updated = reservations.map((r) => {
          if (r.id === reservationId) {
            return {
              ...r,
              status: newStatus,
              adminNotes: note,
              reviewedByName: currentUser.name,
              reviewedAt: new Date().toISOString(),
              history: [
                ...r.history,
                {
                  status: newStatus,
                  timestamp: new Date().toISOString(),
                  changedByName: currentUser.name,
                  notes: note,
                }
              ]
            };
          }
          return r;
        });

        setReservations(updated);
        setActiveModalReq(null);
        setAdminNoteInput('');
        triggerToast(`Status permohonan berhasil diperbarui menjadi: ${newStatus.toUpperCase()}`);
      };

      const handleUpdateProfile = (profileData) => {
        const updated = {

          name: profileData.name,
          phone: profileData.phone,
          identityNumber: profileData.identityNumber,
          organization: profileData.organization,
        };
        setCurrentUser(updated);
        const updatedPersonas = personas.map((p) => p.id === currentUser.id ? updated : p);
        setPersonas(updatedPersonas);
        setShowProfileModal(false);
        triggerToast('Profil pengguna berhasil diperbarui!');
      };

      const handleRegister = (regData) => {
        const newId = `usr_${regData.faculty.toLowerCase()}_${Date.now()}`;
        const newPersona = {
          id: newId,
          name: regData.name,
          email: regData.email,
          role: 'faculty_user',
          faculty: regData.faculty,
          identityNumber: regData.identityNumber,
          phone: regData.phone,
          organization: regData.organization,
          avatarUrl: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
        };
        const updated = [...personas, newPersona];
        setPersonas(updated);
        setCurrentUser(newPersona);
        setShowAuthModal(null);
        setActiveTab('faculty_dashboard');
        triggerToast(`Registrasi akun berhasil! Selamat datang, ${newPersona.name}.`);
      };

      const handleLogin = (email) => {
        const found = personas.find((p) => p.email.toLowerCase() === email.toLowerCase());
        if (found) {
          setCurrentUser(found);
          setShowAuthModal(null);
          setActiveTab(found.role === 'tu_admin' ? 'admin_dashboard' : 'faculty_dashboard');
          triggerToast(`Berhasil masuk sebagai ${found.name}`);
        } else {
          alert('Email tidak terdaftar! Silakan gunakan email demo atau daftarkan akun baru.');

    // --- SUB-COMPONENT: RESERVATION MULTI-STEP WIZARD ---
    function NewReservationForm({ facilities, equipment, existingReservations, onSubmit, onCancel }) {
      const [facilityId, setFacilityId] = useState(facilities[0]?.id || '');
      const [date, setDate] = useState(() => {
        const d = new Date();
        d.setDate(d.getDate() + 2);
        return d.toISOString().split('T')[0];
      });
      const [startTime, setStartTime] = useState('09:00');
      const [endTime, setEndTime] = useState('12:00');
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');
      const [selectedEquipment, setSelectedEquipment] = useState({});
      const [uploadedFile, setUploadedFile] = useState(null);

      // Conflict Checker: Hard block on approved
      const approvedConflict = useMemo(() => {
        const start = new Date(`${date}T${startTime}:00`).getTime();
        const end = new Date(`${date}T${endTime}:00`).getTime();
        return existingReservations.find((r) => {
          if (r.facilityId !== facilityId) return false;
          if (r.status !== 'approved') return false;
          const rStart = new Date(r.startTime).getTime();
          const rEnd = new Date(r.endTime).getTime();
          return start < rEnd && end > rStart;
        });
      }, [facilityId, date, startTime, endTime, existingReservations]);

      // Soft advisory on pending
      const pendingWarning = useMemo(() => {
        const start = new Date(`${date}T${startTime}:00`).getTime();
        const end = new Date(`${date}T${endTime}:00`).getTime();
        return existingReservations.find((r) => {
          if (r.facilityId !== facilityId) return false;
          if (r.status !== 'pending') return false;
          const rStart = new Date(r.startTime).getTime();
          const rEnd = new Date(r.endTime).getTime();
          return start < rEnd && end > rStart;
        });
      }, [facilityId, date, startTime, endTime, existingReservations]);

      // Equipment availability calculation
      const equipmentAvailability = useMemo(() => {
        const start = new Date(`${date}T${startTime}:00`).getTime();
        const end = new Date(`${date}T${endTime}:00`).getTime();

        const overlappingApproved = existingReservations.filter((r) => {
          if (r.status !== 'approved') return false;
          const rStart = new Date(r.startTime).getTime();
          const rEnd = new Date(r.endTime).getTime();
          return start < rEnd && end > rStart;
        });

        const statusMap = {};
        for (const eq of equipment) {
          let committed = 0;
          for (const res of overlappingApproved) {
            const item = res.equipment?.find((e) => e.equipmentId === eq.id);
            if (item) committed += (item.quantityApproved ?? item.quantityRequested);
          }
          const availableInWindow = Math.max(0, eq.totalQuantity - committed);
          statusMap[eq.id] = {
            total: eq.totalQuantity,
            committed,
            availableInWindow,
          };
        }
        return statusMap;
      }, [date, startTime, endTime, existingReservations, equipment]);

      // Check for equipment overbooking
      const overbookingError = useMemo(() => {
        for (const [eqId, qty] of Object.entries(selectedEquipment)) {
          if (qty > 0) {
            const avail = equipmentAvailability[eqId]?.availableInWindow ?? 0;
            if (qty > avail) {
              const eq = equipment.find((e) => e.id === eqId);
              return `Permintaan untuk "${eq?.name}" (${qty} unit) melebihi kuota tersedia untuk jam ini (${avail} unit).`;
            }
          }
        }
        return null;
      }, [selectedEquipment, equipmentAvailability, equipment]);

      const handleEquipmentChange = (eqId, qty) => {
        const num = Math.max(0, parseInt(qty, 10) || 0);
        setSelectedEquipment((prev) => ({
          ...prev,
          [eqId]: num,
        }));
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        if (!file.name.toLowerCase().endsWith('.pdf')) {
          alert('Format berkas tidak valid! Hanya dokumen format PDF yang diizinkan oleh sistem.');
          e.target.value = '';
          return;
        }

        if (file.size > 10 * 1024 * 1024) {
          alert('Ukuran berkas melebihi batas maksimal 10 MB!');
          e.target.value = '';
          return;
        }

        setUploadedFile({
          name: file.name,
          sizeBytes: file.size,
          type: 'application/pdf',
        });
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) {
          alert('Judul kegiatan wajib diisi!');
          return;
        }
        if (approvedConflict) {
          alert('Jadwal bentrok dengan acara resmi yang sudah disetujui! Silakan ubah jam atau ruangan.');
          return;
        }
        if (overbookingError) {
          alert(`Pencegahan Overbooking Sarpras: ${overbookingError}`);
          return;
        }

        const selFac = facilities.find((f) => f.id === facilityId);
        const eqList = Object.entries(selectedEquipment)
          .filter(([_, q]) => q > 0)
          .map(([eqId, q]) => {
            const eq = equipment.find((e) => e.id === eqId);
            return {
              equipmentId: eqId,
              equipmentName: eq?.name || 'Peralatan',
              quantityRequested: q,
            };
          });

        const docs = uploadedFile ? [
          {
            id: `doc_${Date.now()}`,
            name: uploadedFile.name,
            sizeBytes: uploadedFile.sizeBytes,
            type: 'application/pdf',
          }
        ] : [
          {
            id: `doc_${Date.now()}`,
            name: `Surat_Pengantar_${title.replace(/\\s+/g, '_')}.pdf`,
            sizeBytes: 1540000,
            type: 'application/pdf',
          }
        ];

        onSubmit({
          facilityId,
          facilityName: selFac.name,
          facilityBuilding: `${selFac.building} (Lt. ${selFac.floor})`,
          startTime: new Date(`${date}T${startTime}:00`).toISOString(),
          endTime: new Date(`${date}T${endTime}:00`).toISOString(),
          title,
          description,
          eventType: 'student_org',
          expectedAttendees: 50,
          equipment: eqList,
          documents: docs,
        });
      };

      return (
        <form onSubmit={handleFormSubmit} className="bg-white p-6 sm:p-8 rounded-2xl border border-stone-200 shadow-xs space-y-6">
          <div className="border-b pb-4">
            <h3 className="text-base font-bold text-stone-900">Formulir Permohonan Peminjaman Ruang RIK</h3>
            <p className="text-xs text-stone-500 mt-0.5">Sistem otomatis memverifikasi bentrok jadwal dan ketersediaan kuota sarpras antar 5 fakultas.</p>
          </div>

          {/* Room & Date */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label className="block text-xs font-bold text-stone-700 uppercase mb-1">Pilih Ruangan RIK</label>
              <select
                value={facilityId}
                onChange={(e) => setFacilityId(e.target.value)}
                className="w-full p-2.5 bg-stone-50 border border-stone-300 rounded-xl text-xs font-semibold"
              >
                {facilities.map((f) => (
                  <option key={f.id} value={f.id}>{f.name} ({f.building} - Max {f.capacity} Org)</option>
                ))}
              </select>
            </div>

            <div>
              <label className="block text-xs font-bold text-stone-700 uppercase mb-1">Tanggal Acara</label>
              <input
                type="date"
                value={date}
                onChange={(e) => setDate(e.target.value)}
                className="w-full p-2.5 bg-stone-50 border border-stone-300 rounded-xl text-xs font-semibold"
              />
            </div>
          </div>

          {/* Time */}
          <div className="grid grid-cols-2 gap-4">
            <div>
              <label className="block text-xs font-bold text-stone-700 uppercase mb-1">Jam Mulai</label>
              <input
                type="time"
                value={startTime}
                onChange={(e) => setStartTime(e.target.value)}
                className="w-full p-2 bg-stone-50 border border-stone-300 rounded-xl text-xs font-semibold"
              />
            </div>
            <div>
              <label className="block text-xs font-bold text-stone-700 uppercase mb-1">Jam Selesai</label>
              <input
                type="time"
                value={endTime}
                onChange={(e) => setEndTime(e.target.value)}
                className="w-full p-2 bg-stone-50 border border-stone-300 rounded-xl text-xs font-semibold"
              />
            </div>
          </div>

          {/* Realtime Conflict Alerts */}
          {approvedConflict ? (
            <div className="p-3.5 rounded-xl bg-rose-50 border border-rose-300 text-rose-900 text-xs">
              <strong>⛔ Peringatan Bentrok Jadwal (Double-Booking Blocked):</strong>
              <p className="mt-1">
                Ruangan ini sudah <strong>disetujui resmi</strong> untuk: <em>"{approvedConflict.title}"</em> ({new Date(approvedConflict.startTime).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})} - {new Date(approvedConflict.endTime).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})} WIB). Anda tidak dapat mengirim permohonan pada slot ini.
              </p>
            </div>
          ) : pendingWarning ? (
            <div className="p-3.5 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-xs">
              <strong>ℹ️ Catatan Jadwal Bersaing:</strong>
              <p className="mt-1">
                Terdapat permohonan lain yang sedang menunggu review TU pada jam ini (<em>"{pendingWarning.title}"</em>). Anda tetap dapat mengajukan permohonan ini untuk dipertimbangkan oleh TU Pusat.
              </p>
            </div>
          ) : (
            <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-900 text-xs">
              ✓ Jadwal tersedia dan aman untuk dipinjam.
            </div>
          )}

          {/* Title & Description */}
          <div>
            <label className="block text-xs font-bold text-stone-700 uppercase mb-1">Nama / Tajuk Kegiatan</label>
            <input
              type="text"
              required
              placeholder="Contoh: Diskusi Terbuka BEM Farmasi & Keperawatan 2026"
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              className="w-full p-2.5 bg-stone-50 border border-stone-300 rounded-xl text-xs font-semibold"
            />
          </div>

          <div>
            <label className="block text-xs font-bold text-stone-700 uppercase mb-1">Tujuan & Deskripsi Singkat</label>
            <textarea
              rows={2}
              placeholder="Tuliskan tujuan kegiatan dan susunan panitia..."
              value={description}
              onChange={(e) => setDescription(e.target.value)}
              className="w-full p-2.5 bg-stone-50 border border-stone-300 rounded-xl text-xs"
            />
          </div>

          {/* Equipment Selection with Realtime Quotas */}
          <div className="border rounded-2xl p-4 bg-stone-50/70 border-stone-200 space-y-3">
            <div className="flex items-center justify-between border-b pb-2">
              <div>
                <h4 className="text-xs font-bold text-stone-900 uppercase">Peminjaman Sarana & Peralatan (Opsional)</h4>
                <p className="text-[11px] text-stone-500">Sistem memvalidasi ketersediaan stok fisik gudang TU secara real-time.</p>
              </div>
            </div>

            <div className="space-y-2">
              {equipment.map((eq) => {
                const availInfo = equipmentAvailability[eq.id] || { availableInWindow: eq.availableQuantity, committed: 0, total: eq.totalQuantity };
                const currentReq = selectedEquipment[eq.id] || 0;
                const isOver = currentReq > availInfo.availableInWindow;

                return (
                  <div key={eq.id} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-2.5 rounded-xl bg-white border border-stone-200 text-xs">
                    <div>
                      <span className="font-bold text-stone-900">{eq.name}</span>
                      <div className="text-[10px] text-stone-500 mt-0.5">
                        Total Gudang: {availInfo.total} Unit • Terpakai di Jam Ini: {availInfo.committed} Unit • <strong className="text-emerald-800">Tersedia: {availInfo.availableInWindow} Unit</strong>
                      </div>
                    </div>

                    <div className="flex items-center gap-2 self-end sm:self-center">
                      <label className="text-[11px] text-stone-500">Jumlah Pinjam:</label>
                      <input
                        type="number"
                        min="0"
                        max={availInfo.total}
                        value={currentReq}
                        onChange={(e) => handleEquipmentChange(eq.id, e.target.value)}
                        className={`w-16 p-1 text-center font-bold border rounded-lg ${
                          isOver ? 'border-rose-500 bg-rose-50 text-rose-900' : 'border-stone-300 bg-stone-50'
                        }`}
                      />
                      <span className="text-[10px] text-stone-400">Unit</span>
                    </div>
                  </div>
                );
              })}
            </div>

            {overbookingError && (
              <div className="p-2.5 rounded-xl bg-rose-50 border border-rose-300 text-rose-900 text-xs font-bold">
                ⚠️ {overbookingError}
              </div>
            )}
          </div>

          {/* PDF Document Upload */}
          <div className="border rounded-2xl p-4 bg-stone-50/70 border-stone-200 space-y-3">
            <div>
              <h4 className="text-xs font-bold text-stone-900 uppercase">Unggah Dokumen Perizinan (PDF Khusus)</h4>
              <p className="text-[11px] text-stone-500">Lampirkan surat izin atau proposal bertanda tangan pimpinan fakultas (Maks. 10MB, format .PDF).</p>
            </div>

            <div className="flex flex-col sm:flex-row sm:items-center gap-3">
              <input
                type="file"
                accept=".pdf,application/pdf"
                onChange={handleFileUpload}
                className="text-xs text-stone-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-800 hover:file:bg-emerald-100 cursor-pointer"
              />
            </div>

            {uploadedFile ? (
              <div className="flex items-center justify-between p-2.5 bg-emerald-50 border border-emerald-200 rounded-xl text-xs">
                <div className="flex items-center gap-2">
                  <span className="text-base">📄</span>
                  <div>
                    <span className="font-bold text-emerald-950">{uploadedFile.name}</span>
                    <span className="text-[10px] text-emerald-700 ml-2">({(uploadedFile.sizeBytes / 1024).toFixed(0)} KB)</span>
                  </div>
                </div>
                <button
                  type="button"
                  onClick={() => setUploadedFile(null)}
                  className="text-rose-600 hover:text-rose-800 font-bold text-xs"
                >
                  ✕ Hapus
                </button>
              </div>
            ) : (
              <p className="text-[11px] text-stone-400 italic">
                * Jika belum memilih berkas fisik, sistem simulasi akan menyematkan berkas PDF proposal default otomatis saat pengiriman.
              </p>
            )}
          </div>

          <div className="flex justify-end gap-3 pt-4 border-t">
            <button
              type="button"
              onClick={onCancel}
              className="px-4 py-2 rounded-xl border text-xs font-bold hover:bg-stone-50"
            >
              Batal
            </button>
            <button
              type="submit"
              disabled={Boolean(approvedConflict) || Boolean(overbookingError)}
              className="px-5 py-2.5 rounded-xl bg-[#1B4332] hover:bg-[#132A13] disabled:opacity-40 text-white font-bold text-xs shadow-md transition-all"
            >
              Kirim Permohonan ke TU Pusat
            </button>
          </div>
        </form>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
